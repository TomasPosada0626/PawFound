# Respaldo del despertador externo (cron-job.org, docs/DESPLIEGUE.md §7): GitHub no garantiza la hora de los
# trabajos programados y en la práctica este corre cada varias horas, así que no basta solo.
# Render duerme el servicio tras 15 minutos sin tráfico; dormido no corren las alertas del círculo
# de vida, y de noche es cuando más mascotas se pierden (pólvora). Por eso se visita todo el día.
#
# /health no toca la base de datos: Neon sigue durmiéndose entre las tareas periódicas, así el
# plan gratis alcanza.
name: Mantener la API despierta

on:
  schedule:
    # Cada 5 minutos, todo el día.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  visitar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar /health
        run: curl -fsS --max-time 120 --retry 2 https://pawfound-api.onrender.com/health

openapi: 3.1.0
info:
  title: PawFound API
  version: 0.2.0-dev
  description: >
    Contrato de la API de PawFound. Fuente de verdad del request/response shape entre
    apps/api y apps/mobile. Las formas coinciden con apps/mobile/src/domain/types.ts.

    Reglas transversales: toda ubicación que devuelve la API ya está aproximada a celdas de
    250 m (nunca el punto exacto); los errores de negocio llegan como {"error": {"code",
    "params"}} con códigos traducibles por la app; las acciones de escritura comunitaria
    exigen celular verificado (insignia azul).
servers:
  - url: http://localhost:8080
    description: Desarrollo local
security:
  - bearer: []

tags:
  - name: auth
  - name: me
  - name: pets
  - name: chats
  - name: community
  - name: media

paths:
  /health:
    get:
      operationId: getHealth
      tags: [auth]
      security: []
      summary: El proceso está vivo
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } } }
  /ready:
    get:
      operationId: getReady
      tags: [auth]
      security: []
      summary: La base de datos responde
      responses:
        "200": { description: OK }
        "503": { description: Sin base de datos }

  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      security: []
      summary: Crea la cuenta y envía el código SMS (límite por IP)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RegisterInput" } } } }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      summary: Correo y contraseña. Mismo error para correo inexistente y clave incorrecta.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/oauth:
    post:
      operationId: loginWithProvider
      tags: [auth]
      security: []
      summary: ID token de Google o Apple (OIDC). Facebook responde provider_unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, idToken]
              properties:
                provider: { type: string, enum: [google, apple, facebook] }
                idToken: { type: string }
                lang: { $ref: "#/components/schemas/Lang" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      security: []
      summary: Rota el refresh token. Reusar uno ya rotado revoca toda la familia.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshInput" } } } }
      responses:
        "204": { description: Sesión cerrada }
  /v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      security: []
      summary: Siempre 202, exista o no la cuenta
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { email: { type: string } } } } } }
      responses:
        "202": { description: Si la cuenta existe, se envió el enlace }
  /v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string } } } } } }
      responses:
        "204": { description: Contraseña cambiada; se cierran todas las sesiones }
        "410": { $ref: "#/components/responses/Error" }
  /v1/auth/phone:
    post:
      operationId: startPhoneVerification
      tags: [auth]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone], properties: { phone: { type: string } } } } } }
      responses:
        "204": { description: Código enviado }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/auth/phone/resend:
    post:
      operationId: resendCode
      tags: [auth]
      summary: Reenvía el código (espera de 45 s)
      responses:
        "200": { description: Reenviado, content: { application/json: { schema: { type: object, properties: { resendInSeconds: { type: integer } } } } } }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/phone/verify:
    post:
      operationId: verifyCode
      tags: [auth]
      summary: Verifica el celular y otorga la insignia azul (5 intentos, luego 5 min de bloqueo)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses:
        "200": { description: Verificado, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/me:
    get:
      operationId: getMe
      tags: [me]
      responses:
        "200": { description: Cuenta propia, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
    patch:
      operationId: updateProfile
      tags: [me]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProfilePatch" } } } }
      responses:
        "200": { description: Perfil actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAccount
      tags: [me]
      summary: Derecho al olvido. Los reportes activos se archivan sin autor.
      responses:
        "204": { description: Cuenta eliminada }
  /v1/me/export:
    get:
      operationId: exportData
      tags: [me]
      summary: Portabilidad (Ley 1581)
      responses:
        "200": { description: Todos los datos de la cuenta, content: { application/json: { schema: { type: object } } } }
  /v1/me/lang:
    put:
      operationId: setLanguage
      tags: [me]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { lang: { $ref: "#/components/schemas/Lang" } } } } } }
      responses:
        "204": { description: Guardado }
  /v1/me/notification-prefs:
    put:
      operationId: updateNotificationPrefs
      tags: [me]
      summary: Cambio parcial; lo no enviado se conserva
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPrefs" } } } }
      responses:
        "200": { description: Preferencias completas, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPrefs" } } } }
  /v1/me/privacy:
    put:
      operationId: updatePrivacy
      tags: [me]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PrivacyPrefs" } } } }
      responses:
        "200": { description: Guardado, content: { application/json: { schema: { $ref: "#/components/schemas/PrivacyPrefs" } } } }
  /v1/me/alert-zone:
    put:
      operationId: setAlertZone
      tags: [me]
      summary: Guarda la zona de Alertas Ángel (aproximada) y registra el consentimiento
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AlertZone" } } } }
      responses:
        "200": { description: Zona aproximada guardada, content: { application/json: { schema: { $ref: "#/components/schemas/AlertZone" } } } }
    delete:
      operationId: deleteAlertZone
      tags: [me]
      summary: Revoca el consentimiento y borra la zona
      responses:
        "204": { description: Borrada }
  /v1/me/devices:
    post:
      operationId: registerDevice
      tags: [me]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, platform], properties: { token: { type: string }, platform: { type: string, enum: [android, ios] } } } } } }
      responses:
        "204": { description: Registrado }
    delete:
      operationId: unregisterDevice
      tags: [me]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses:
        "204": { description: Borrado }
  /v1/me/pets:
    get:
      operationId: myReports
      tags: [me]
      responses:
        "200": { description: Reportes propios, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Pet" } } } } }
  /v1/me/owned-pets:
    get:
      operationId: ownedPets
      tags: [me]
      responses:
        "200": { description: Mis mascotas, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OwnedPet" } } } } }
    post:
      operationId: createOwnedPet
      tags: [me]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OwnedPetInput" } } } }
      responses:
        "201": { description: Creada, content: { application/json: { schema: { $ref: "#/components/schemas/OwnedPet" } } } }
  /v1/me/owned-pets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: updateOwnedPet
      tags: [me]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OwnedPetInput" } } } }
      responses:
        "200": { description: Actualizada, content: { application/json: { schema: { $ref: "#/components/schemas/OwnedPet" } } } }
    delete:
      operationId: deleteOwnedPet
      tags: [me]
      responses:
        "204": { description: Borrada }
  /v1/me/owned-pets/{id}/matches:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: ownedPetMatches
      tags: [me]
      summary: Reportes de mascotas encontradas que se parecen a esta (domain/matching)
      responses:
        "200":
          description: Coincidencias
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches: { type: array, items: { $ref: "#/components/schemas/OwnedMatch" } }
                  needsAlertZone: { type: boolean }
  /v1/me/notifications:
    get:
      operationId: notifications
      tags: [me]
      responses:
        "200": { description: Las 100 más recientes, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Notification" } } } } }
  /v1/me/notifications/read-all:
    post:
      operationId: readAllNotifications
      tags: [me]
      responses:
        "204": { description: Leídas }
  /v1/me/notifications/{id}/read:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: readNotification
      tags: [me]
      responses:
        "204": { description: Leída }

  /v1/pets:
    get:
      operationId: nearbyPets
      tags: [pets]
      security: [{}, { bearer: [] }]
      summary: Casos activos dentro del radio, por cercanía (PostGIS)
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: radius, in: query, schema: { type: integer, maximum: 50000, default: 20000 } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/CaseKind" } }
        - { name: species, in: query, schema: { $ref: "#/components/schemas/Species" } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        "200": { description: Casos, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Pet" } } } } }
    post:
      operationId: createReport
      tags: [pets]
      summary: Publica un reporte (2 por día), crea su grupo y envía Alertas Ángel y coincidencias
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReportInput" } } } }
      responses:
        "201": { description: Publicado, content: { application/json: { schema: { $ref: "#/components/schemas/Pet" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/pets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getPet
      tags: [pets]
      security: [{}, { bearer: [] }]
      responses:
        "200": { description: Caso, content: { application/json: { schema: { $ref: "#/components/schemas/Pet" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: withdrawReport
      tags: [pets]
      summary: La familia retira su reporte (se archiva)
      responses:
        "204": { description: Archivado }
  /v1/pets/{id}/share:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: sharePet
      tags: [pets]
      security: [{}, { bearer: [] }]
      responses:
        "204": { description: Contado }
  /v1/pets/{id}/sightings:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: addSighting
      tags: [pets]
      summary: '"La vi"'
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SightingInput" } } } }
      responses:
        "201": { description: Caso actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Pet" } } } }
  /v1/pets/{id}/reunite:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: reunite
      tags: [pets]
      summary: Cierra el caso y agradece hasta 5 personas que participaron ("Ángel de patas")
      requestBody: { content: { application/json: { schema: { type: object, properties: { helperIds: { type: array, items: { type: string }, maxItems: 5 } } } } } }
      responses:
        "200": { description: Cerrado, content: { application/json: { schema: { $ref: "#/components/schemas/Pet" } } } }
  /v1/pets/{id}/helpers:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: reunionHelpers
      tags: [pets]
      summary: Solo la familia. Quienes reportaron avistamientos, escribieron en el grupo o por DM.
      responses:
        "200": { description: Candidatos, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/HelperCandidate" } } } } }
  /v1/pets/{id}/matches:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: possibleMatches
      tags: [pets]
      summary: Solo la familia. Reportes del tipo opuesto que podrían ser la misma mascota.
      responses:
        "200": { description: Coincidencias, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Pet" } } } } }
  /v1/pets/{id}/report:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: reportPet
      tags: [pets]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/ReportReasonInput" } } } }
      responses:
        "204": { description: En la cola de moderación }
  /v1/pets/{id}/join:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: joinGroup
      tags: [chats]
      responses:
        "200": { $ref: "#/components/responses/ThreadId" }
  /v1/pets/{id}/direct:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: openDirect
      tags: [chats]
      summary: Abre o reutiliza el DM con la familia. Respeta "quién puede escribirme".
      responses:
        "200": { $ref: "#/components/responses/ThreadId" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/threads:
    get:
      operationId: threads
      tags: [chats]
      responses:
        "200": { description: Chats propios, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Thread" } } } } }
  /v1/threads/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: thread
      tags: [chats]
      responses:
        "200": { description: Chat, content: { application/json: { schema: { $ref: "#/components/schemas/Thread" } } } }
  /v1/threads/{id}/messages:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: messages
      tags: [chats]
      parameters:
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        "200": { description: Mensajes en orden cronológico, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Message" } } } } }
    post:
      operationId: sendMessage
      tags: [chats]
      summary: Texto, foto o ambos. 12 por minuto; bloqueado si moderación restringió la cuenta.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SendInput" } } } }
      responses:
        "201": { description: Enviado, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/threads/{id}/read:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: readThread
      tags: [chats]
      responses:
        "204": { description: Leído }
  /v1/threads/{id}/mute:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: toggleMute
      tags: [chats]
      responses:
        "200": { description: Estado, content: { application/json: { schema: { type: object, properties: { muted: { type: boolean } } } } } }
  /v1/ws:
    get:
      operationId: realtime
      tags: [chats]
      security: []
      summary: >
        WebSocket. El primer mensaje debe ser {"type":"auth","token":"<accessToken>"} (el token
        nunca va en la URL). Eventos: ready, message (Message), notification (Notification).
      responses:
        "101": { description: Conexión abierta }

  /v1/users/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: publicProfile
      tags: [community]
      security: [{}, { bearer: [] }]
      summary: Ningún perfil es oculto. Nunca incluye correo ni celular.
      responses:
        "200": { description: Perfil, content: { application/json: { schema: { $ref: "#/components/schemas/PublicProfile" } } } }
  /v1/users/{id}/like:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: toggleLike
      tags: [community]
      summary: Da o quita el me gusta (cuentas verificadas, uno por persona, no a uno mismo)
      responses:
        "200": { description: Estado, content: { application/json: { schema: { type: object, properties: { liked: { type: boolean }, likes: { type: integer } } } } } }
  /v1/users/{id}/report:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: reportUser
      tags: [community]
      summary: Sin bloqueos; se reporta y moderación decide
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReportReasonInput" } } } }
      responses:
        "204": { description: En la cola de moderación }

  /v1/media:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Sube una foto. Se re-codifica a JPEG (sin EXIF ni GPS), máx. 1600 px, 8 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file: { type: string, format: binary }
                purpose: { type: string, enum: [pet, owned, chat] }
      responses:
        "201": { description: Subida, content: { application/json: { schema: { $ref: "#/components/schemas/UploadedMedia" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/media/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getMedia
      tags: [media]
      security: [{}, { bearer: [] }]
      summary: Fotos de reportes y Mis mascotas son públicas; las de chat, solo para miembros
      responses:
        "200": { description: JPEG, content: { image/jpeg: {} } }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: Error de negocio
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Session:
      description: Sesión abierta
      content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
    ThreadId:
      description: Chat
      content: { application/json: { schema: { type: object, properties: { threadId: { type: string } } } } }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [unauthorized, invalid_credentials, email_taken, phone_taken, invalid_phone, wrong_code, locked, expired,
                rate_limited, not_allowed, not_found, cannot_message, invalid_username, username_taken, muted, suspended,
                invalid_input, invalid_image, provider_unavailable, unknown]
            params: { type: object, additionalProperties: true }
    Lang: { type: string, enum: [es, en] }
    Species: { type: string, enum: [dog, cat, other] }
    Sex: { type: string, enum: [male, female, unknown] }
    Age: { type: string, enum: [puppy, young, adult, senior, unknown] }
    Size: { type: string, enum: [small, medium, large] }
    CaseKind: { type: string, enum: [lost, found] }
    LatLng:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number }
        longitude: { type: number }
    RegisterInput:
      type: object
      required: [name, email, phone, password, acceptTerms, confirmAge]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        phone: { type: string, description: Celular colombiano (se normaliza a E.164) }
        password: { type: string, minLength: 8 }
        lang: { $ref: "#/components/schemas/Lang" }
        acceptTerms: { type: boolean }
        confirmAge: { type: boolean }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    Session:
      type: object
      properties:
        accessToken: { type: string }

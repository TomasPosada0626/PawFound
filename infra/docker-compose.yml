services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: pawfound
      POSTGRES_PASSWORD: pawfound
      POSTGRES_DB: pawfound
    ports:
      - "5432:5432"
    volumes:
      - pawfound_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawfound"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pawfound_postgres_data:
